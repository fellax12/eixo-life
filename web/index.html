.money-current{font:900 24px Manrope;margin:12px 0 4px}.money-box{padding:15px;background:var(--surface-2);border-radius:16px;margin-bottom:14px}.money-box strong{display:block;font:900 25px Manrope;margin-top:5px}.money-box span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.btn.compact{padding:9px 12px;font-size:11px}
.sound-controls{display:flex;gap:7px;align-items:center;min-width:200px}.sound-controls select{min-width:125px}.sound-controls .btn{padding:10px 12px;flex:0 0 auto}

.essential-hero{padding:22px;border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 10%,var(--surface)),var(--surface-2))}.essential-hero h2{font:850 25px Manrope;margin:8px 0}.essential-hero p{font-size:13px;color:var(--muted);line-height:1.55}.essential-actions{display:flex;gap:8px;margin-top:16px}.essential-card{padding:8px 16px}.essential-line{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.essential-line:last-child{border-bottom:0}.essential-line>span{width:30px;height:30px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:850}.essential-line>div{flex:1}.essential-line small{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em;margin-bottom:4px}.essential-line b{font-size:13px;line-height:1.4;display:block}.essential-quick{grid-template-columns:1fr 1fr}
.financial-insight{margin-top:12px;padding:11px 12px;border-radius:13px;background:var(--surface-3);display:grid;gap:4px}.financial-insight b{font-size:11px}.financial-insight span{font-size:10px;color:var(--muted)}
.compare-card,.review-card{padding:18px;display:flex;align-items:center;justify-content:space-between;gap:14px}.compare-card h2,.review-card h2{font:800 18px Manrope;margin:5px 0}.compare-card p,.review-card p{font-size:11px;color:var(--muted);line-height:1.45}.compare-badge{flex:0 0 auto;padding:10px 12px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-weight:850}.compare-badge.down{background:rgba(255,107,107,.11);color:var(--danger)}

@media(max-width:520px){.today-tools{grid-template-columns:1fr}.compare-card,.review-card{align-items:flex-start}.review-card{flex-direction:column}.signal-grid{grid-template-columns:1fr 1fr 1fr}}


/* EIXO v0.5 — Pulso diário e orientação ativa */
.pulse-backdrop{background:rgba(4,6,8,.72);backdrop-filter:blur(14px);align-items:center;padding:18px}
.pulse-sheet{width:min(520px,100%);border-radius:28px;padding:22px;max-height:none;background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 8%,var(--surface)),var(--surface));box-shadow:0 30px 80px rgba(0,0,0,.4)}
.pulse-mark{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:23px;margin-bottom:18px;animation:pulseGlow 2.2s ease-in-out infinite}

.pulse-note{font-size:9px;color:var(--muted);text-align:center;margin-top:14px}.pulse-phrase{padding:14px;border-radius:16px;background:var(--accent-soft);color:var(--text);font-size:12px;line-height:1.5;margin-bottom:14px}.pulse-phrase b{color:var(--accent)}
.pulse-card{padding:15px 16px;margin:12px 0 0;display:flex;align-items:center;gap:12px;border-color:color-mix(in srgb,var(--accent) 32%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 7%,var(--surface)),var(--surface))}.pulse-card .pulse-dot{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:900;flex:0 0 auto}.pulse-card .pulse-copy{flex:1;min-width:0}.pulse-card .pulse-copy small{display:block;font-size:8px;letter-spacing:.13em;color:var(--muted);font-weight:800;margin-bottom:3px}.pulse-card .pulse-copy b{display:block;font-size:12px;line-height:1.35}.pulse-card button{border:0;background:transparent;color:var(--accent);font-weight:850;font-size:10px;cursor:pointer}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 0%,transparent)}50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 8%,transparent)}}
@media(max-width:430px){.pulse-sheet{padding:20px;border-radius:24px}.pulse-sheet h2{font-size:24px}.pulse-choices{grid-template-columns:1fr 1fr}.pulse-choice{padding:13px 11px}}


/* EIXO v0.7 — conta Supabase + sincronização */
.auth-shell{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 85% 10%,var(--accent-soft),transparent 32%),var(--bg)}
.auth-card{width:min(460px,100%);padding:22px;border:1px solid var(--line);background:linear-gradient(180deg,var(--surface),var(--surface-2));border-radius:26px;box-shadow:var(--shadow)}

.auth-form{display:grid;gap:12px}.auth-google{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:12px;border-radius:14px;font-weight:750;cursor:pointer}.auth-google:disabled{opacity:.55;cursor:not-allowed}.auth-divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:10px;margin:3px 0}.auth-divider:before,.auth-divider:after{content:"";height:1px;flex:1;background:var(--line)}.auth-note{font-size:11px;color:var(--muted);line-height:1.5;text-align:center}.auth-message{padding:11px 12px;border-radius:13px;background:var(--accent-soft);color:var(--text);font-size:11px;line-height:1.45}.sync-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:var(--surface-3);font-size:10px;color:var(--muted)}.sync-badge.synced{background:rgba(102,209,158,.12);color:var(--success)}.sync-badge.syncing{background:var(--accent-soft);color:var(--accent)}.sync-badge.error{background:rgba(255,107,107,.12);color:var(--danger)}


/* EIXO v0.8 — Tração, níveis e Marcos */
.traction-card{padding:17px 18px;margin-top:12px;cursor:pointer;overflow:hidden;position:relative;border-color:color-mix(in srgb,var(--accent) 24%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 6%,var(--surface)),var(--surface))}.traction-card:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;right:-56px;top:-66px;background:radial-gradient(circle,var(--accent-soft),transparent 70%)}.traction-head{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}.traction-level{display:flex;align-items:center;gap:10px}.traction-symbol{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:900;font-size:18px}.traction-level small{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em;font-weight:800}.traction-level b{display:block;font:800 15px Manrope;margin-top:2px}.traction-points{font:900 20px Manrope;position:relative;z-index:1}.traction-points span{font:700 9px Manrope;color:var(--muted);display:block;text-align:right;letter-spacing:.08em}.traction-track{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:13px;position:relative;z-index:1}.traction-track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s var(--ease)}.traction-foot{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:9px;position:relative;z-index:1}.milestone-banner{display:flex;align-items:center;gap:12px;padding:14px 15px;margin-top:10px;border:1px solid color-mix(in srgb,var(--success) 28%,var(--line));border-radius:17px;background:color-mix(in srgb,var(--success) 7%,var(--surface));animation:pageIn .35s var(--ease)}.milestone-mark{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;background:rgba(102,209,158,.12);color:var(--success);font-size:19px;flex:0 0 auto}.milestone-copy{flex:1;min-width:0}.milestone-copy small{display:block;font-size:8px;letter-spacing:.12em;font-weight:850;color:var(--success);margin-bottom:3px}.milestone-copy b{display:block;font-size:12px;line-height:1.35}.milestone-banner button{border:0;background:transparent;color:var(--muted);font-size:17px;padding:8px;cursor:pointer}.traction-hero{padding:19px}.traction-big{font:900 42px/1 Manrope;letter-spacing:-.05em;margin:8px 0 4px}.traction-big span{font:800 11px Manrope;color:var(--muted);letter-spacing:.08em}.level-row{display:flex;justify-content:space-between;gap:7px;margin-top:15px}.level-node{flex:1;height:5px;border-radius:99px;background:var(--surface-3)}.level-node.on{background:var(--accent)}.milestone-grid{display:grid;gap:9px;margin-top:12px}.milestone-item{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2)}.milestone-item.locked{opacity:.54}.milestone-item .m-icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface-3);font-size:18px;flex:0 0 auto}.milestone-item.unlocked .m-icon{background:var(--accent-soft);color:var(--accent)}.milestone-item .m-copy{flex:1}.milestone-item b{font-size:12px;display:block}.milestone-item span{display:block;color:var(--muted);font-size:9px;line-height:1.4;margin-top:3px}.reward-tag{display:inline-flex!important;width:auto;margin-top:6px!important;padding:4px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent)!important;font-weight:800}.traction-why{padding:15px;background:var(--surface-2);border-radius:16px;font-size:11px;line-height:1.55;color:var(--muted);margin-top:14px}.traction-why b{color:var(--text)}



/* EIXO v0.9 — área Pro */
.pro-entry{padding:17px 18px;margin-top:12px;cursor:pointer;position:relative;overflow:hidden;border-color:color-mix(in srgb,var(--accent) 24%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 8%,var(--surface)),var(--surface))}.pro-entry:after{content:"";position:absolute;width:150px;height:150px;right:-70px;top:-85px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 70%)}.pro-entry-head{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}.pro-entry-title{display:flex;align-items:center;gap:11px}.pro-mark{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:var(--bg);font:900 14px Manrope;letter-spacing:-.04em}.pro-entry-copy small{display:block;color:var(--accent);font-size:8px;letter-spacing:.13em;font-weight:900}.pro-entry-copy b{display:block;font:800 15px Manrope;margin-top:3px}.pro-entry p{position:relative;z-index:1;margin:12px 0 0;color:var(--muted);font-size:11px;line-height:1.55;max-width:85%}.pro-pill{position:relative;z-index:1;white-space:nowrap;padding:6px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:8px;font-weight:900;letter-spacing:.07em}.pro-page{padding-bottom:110px}.pro-hero{padding:22px;position:relative;overflow:hidden;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 11%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--accent) 26%,var(--line))}.pro-hero:after{content:"PRO";position:absolute;right:-8px;bottom:-24px;font:900 86px/1 Manrope;letter-spacing:-.08em;color:color-mix(in srgb,var(--accent) 7%,transparent);pointer-events:none}.pro-plan-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:18px;position:relative;z-index:1}.pro-price strong{font:900 34px/1 Manrope;letter-spacing:-.055em}.pro-price span{display:block;color:var(--muted);font-size:10px;margin-top:5px}.pro-status{padding:7px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:8px;font-weight:900;letter-spacing:.08em}.pro-feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pro-feature{padding:15px;min-height:132px}.pro-feature i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-style:normal;font-weight:900;margin-bottom:12px}.pro-feature b{display:block;font:800 12px/1.3 Manrope}.pro-feature span{display:block;color:var(--muted);font-size:9px;line-height:1.5;margin-top:6px}.pro-note{padding:16px 17px;border:1px solid var(--line);border-radius:17px;background:var(--surface);font-size:10px;line-height:1.6;color:var(--muted)}.pro-note b{color:var(--text)}.pro-future{padding:18px;border-style:dashed}.pro-future .future-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}.pro-future .future-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surface-3);font-weight:900}.pro-future p{margin:0;color:var(--muted);font-size:10px;line-height:1.55}.pro-cta{margin-top:12px}.pro-cta[disabled]{opacity:.72;cursor:default}.pro-back{display:flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--muted);padding:6px 0;font:700 10px Manrope;cursor:pointer}


/* EIXO v0.13 — polimento de alinhamento e simetria */
.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1.2}
.more-btn,.icon-btn{display:grid;place-items:center;padding:0;line-height:1;flex:0 0 auto}
.fab{display:grid;place-items:center;padding:0;line-height:1}
.check{padding:0;margin-top:0;line-height:1;font-size:0;position:relative;overflow:visible}
.task.done .check::after,.habit-row.done .check::after,.essential-line .check.done::after{content:"";width:6px;height:11px;border:solid currentColor;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg);display:block}
.task .check,.habit-row .check{margin-top:1px}
.quick-icon,.today-tools button>span,.setting-ico,.traction-symbol,.milestone-mark,.milestone-item .m-icon,.pro-mark,.pro-feature i,.pro-future .future-mark{flex:0 0 auto}
.topbar{gap:16px;padding:4px 2px 20px}
.topbar>div:first-child{flex:1;min-width:0}
.profile-shortcut{margin:0 2px 0 12px}
.greeting{overflow:hidden;text-overflow:ellipsis}
.today-tools button{min-height:62px}
.today-tools button>span{line-height:1}
.essential-hero{padding:22px 22px 21px}
.essential-actions{align-items:stretch;gap:10px}
.essential-actions .btn{min-height:48px;padding:12px 16px}
.essential-card{padding:8px 18px}
.essential-line{min-height:76px;gap:14px;padding:16px 0}
.essential-line>span{width:40px;height:40px;flex:0 0 40px;border-radius:13px;font-size:15px;line-height:1}
.essential-line>div{flex:1;min-width:0}
.essential-line small{line-height:1.2;margin-bottom:5px}
.essential-line b{line-height:1.35}
.essential-line .check{width:40px;height:40px;flex:0 0 40px;align-self:center;margin:0 0 0 auto;border-radius:13px;border-width:1.5px;color:var(--text)}
.essential-line .check.done{background:var(--surface-2);border-color:var(--muted)}
.bottom-nav{align-items:stretch}
.nav-item{padding:7px 4px;gap:4px;line-height:1.1;min-width:0}
.nav-item .ico{width:24px;height:24px;display:grid;place-items:center;font-size:20px;line-height:1}
.nav-item.active .ico{transform:none}
.day>div{text-align:center;line-height:1.15}
.day b{display:inline-block;line-height:1}
.day span{display:inline-block;margin-top:4px;line-height:1}
.day-dot{left:50%;transform:translateX(-50%)}
.setting{min-height:66px}
.setting-copy{min-width:0}
.goal-head,.north-head,.traction-head,.pro-entry-head{align-items:center}
.review-card,.compare-card{min-height:88px}
@media(max-width:430px){
  .page{padding-left:18px;padding-right:18px}
  .topbar{gap:14px}
  .essential-card{padding-left:16px;padding-right:16px}
  .essential-line{gap:12px}
}

.eixo-bulk-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:9px;margin:12px 0}
.eixo-bulk-buttons{display:flex;align-items:center;flex-wrap:wrap;gap:7px}
.eixo-bulk-buttons .btn,.eixo-bulk-top .btn{font-size:12px;padding:9px 11px}
.eixo-bulk-chosen{border-color:var(--accent)!important;background:var(--accent-soft)!important}
.eixo-bulk-checked{background:var(--accent)!important;color:white!important;border-color:var(--accent)!important}
[data-reset-kind]{cursor:pointer}
button:disabled{opacity:.48;cursor:not-allowed}
/* EIXO v0.15 — Pequenos movimentos: calor, clareza e escolha. */
:root{--v15-blue:#6abfe6;--v15-green:#79cda6;--v15-violet:#a68cf6;--v15-orange:#ec985d;--v15-pink:#e9a2ca;--v15-yellow:#e9bd62}
.v15-teaser{margin-top:15px;padding:18px;border:1px solid color-mix(in srgb,var(--accent) 34%,var(--line));border-radius:24px;background:radial-gradient(circle at 95% 0%,color-mix(in srgb,var(--accent) 17%,transparent),transparent 58%),linear-gradient(135deg,var(--surface-2),var(--surface));overflow:hidden}
.v15-teaser-top{display:flex;gap:13px;align-items:center}.v15-sun{width:44px;height:44px;flex:0 0 44px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 21%,var(--surface));color:var(--accent);font-size:25px}.v15-teaser-top small{font-size:9px;letter-spacing:.14em;color:var(--accent);font-weight:850}.v15-teaser-top h2{font:850 21px/1.15 Manrope,system-ui,sans-serif;letter-spacing:-.03em;margin:4px 0}.v15-teaser-top p{font-size:11px;color:var(--muted);margin:0;line-height:1.5}

  function advanceTaskMetric(id,amount,{silent=false}={}){
    const t=state.tasks.find(x=>String(x.id)===String(id));if(!t?.metric||t.done)return false;
    const m=t.metric,n=Number(amount);if(!Number.isFinite(n)||n<=0||n>10000000)return false;

  }
  function advanceHabitMetric(id,amount,{silent=false}={}){

  function completeDailyPulse(action){
    const mood=modal?.mood||'neutro',entry={mood,action,createdAt:Date.now()};
    state.dailyPulse=state.dailyPulse||{};state.dailyPulse[todayISO()]=entry;
    const hasToday=(state.checkins||[]).some(c=>c.date===todayISO()&&c.source==='pulse');
    if(!hasToday)state.checkins.push({id:uid(),date:todayISO(),mood:pulseMoodLabel(mood),source:'pulse',createdAt:Date.now()});
    const reward=awardTraction(`pulse:${todayISO()}`,8,'Pulso do dia');
    save();
    if(action==='focus')modal={type:'focus',minutes:25};
    else if(action==='capture')modal={type:'capture'};
    else if(action==='essential')modal={type:'essential'};
    else if(action==='goal'){route='goals';state.lastRoute=route;modal=null;save();}
    else modal={type:'task'};
    render();setTimeout(()=>rewardToast(reward,'Pulso registrado. Agora, só o próximo passo.'),120);
  }

  function taskHtml(t){
    const overdue=t.date && t.date<todayISO() && !t.done;
    const rep=t.repeat&&t.repeat!=='none'?`<span class="pill">↻ ${t.repeat==='daily'?'diária':t.repeat==='weekly'?'semanal':'mensal'}</span>`:'';
    if(bulkMode && route==='plan' && planTab==='tasks'){
      const chosen=selectedTaskIds.has(String(t.id));
      const id=esc(String(t.id));
      return '<article class="task '+(chosen?'eixo-bulk-chosen':'')+'" data-bulk-toggle="'+id+'"><button class="check '+(chosen?'eixo-bulk-checked':'')+'" data-bulk-toggle="'+id+'" aria-label="Selecionar tarefa">'+(chosen?'✓':'')+'</button><div class="task-body" data-bulk-toggle="'+id+'"><div class="task-title">'+esc(t.title)+'</div><div class="task-meta"><span class="pill">'+esc(t.category||'Geral')+'</span><span class="pill">'+(t.done?'Concluída':'Pendente')+'</span></div></div><button class="more-btn" data-bulk-toggle="'+id+'" aria-label="Selecionar">'+(chosen?'✓':'○')+'</button></article>';
    }
    if(t.metric){
      const m=t.metric,cur=Number(m.current)||0,max=Number(m.target)||1;
      return `<article class="v15-metric-card" data-tone="${esc(t.tone||'orange')}"><div class="v15-metric-head">${iconBox(t.icon,t.tone)}<div class="task-body"><b>${esc(t.title)}</b><p>${t.done?'✨ Concluído':`${activityUnitText(cur,m.unit)} de ${activityUnitText(max,m.unit)}`}${t.date&&t.date!==todayISO()?` · ${fmtDate(t.date)}`:''}</p></div><button class="check ${t.done?'done':''}" data-toggle-task="${t.id}" aria-label="${t.done?'Reabrir':'Concluir'} tarefa">${t.done?'✓':''}</button><button class="more-btn" data-edit-task="${t.id}" aria-label="Editar">•••</button></div>${metricBar(cur,max)}${activityQuickButtons(t.id,m.unit,'task',cur,max)}${!t.done&&m.unit==='min'?`<button class="v15-focus-link" data-activity-focus="${t.id}">◉ Iniciar foco para esta atividade →</button>`:''}</article>`;
    }
    return `<article class="task ${t.done?'done':''}" data-task="${t.id}"><button class="check" data-toggle-task="${t.id}" aria-label="Concluir tarefa">${t.done?'✓':''}</button><div class="task-body"><div class="task-title">${t.icon?`${esc(t.icon)} `:''}${esc(t.title)}</div><div class="task-meta">${t.time?`<span class="pill ${overdue?'danger':''}">◷ ${esc(t.time)}</span>`:''}${t.date&&t.date!==todayISO()?`<span class="pill">${fmtDate(t.date)}</span>`:''}<span class="pill">${esc(t.category||'Geral')}</span>${t.priority==='Alta'?'<span class="pill accent">Alta prioridade</span>':''}${rep}${t.reminder?'<span class="pill">◉ Lembrete</span>':''}</div></div><button class="more-btn" data-edit-task="${t.id}" aria-label="Editar">•••</button></article>`;
  }
  function habitHtml(h){
    const done=(h.completions||[]).includes(todayISO()),count=habitWeekCount(h),target=Math.max(1,Number(h.targetPerWeek)||7);
    if(h.metricDaily){
      const day=h.progressByDate?.[todayISO()]||{current:0},cur=Number(day.current)||0,max=Number(h.metricDaily.target)||1;
      return `<article class="v15-metric-card v15-habit-row" data-tone="${esc(h.tone||'green')}"><div class="v15-metric-head">${iconBox(h.icon,h.tone)}<div class="task-body"><b>${esc(h.title)}</b><p>${activityUnitText(cur,h.metricDaily.unit)} de ${activityUnitText(max,h.metricDaily.unit)} · ${count}/${target} dias esta semana</p></div><button class="check ${done?'done':''}" data-toggle-habit="${h.id}" aria-label="${done?'Desmarcar':'Concluir'} ritmo">${done?'✓':''}</button><button class="more-btn" data-edit-habit="${h.id}" aria-label="Editar">•••</button></div>${metricBar(cur,max)}${activityQuickButtons(h.id,h.metricDaily.unit,'habit',cur,max)}${!done&&h.metricDaily.unit==='min'?`<button class="v15-focus-link" data-habit-focus="${h.id}">◉ Iniciar foco para este Ritmo →</button>`:''}<div class="v15-metric-foot"><span>🌱 Volte quando puder</span><span>${habitStreak(h)} dia(s) em movimento</span></div></article>`;
    }
    return `<article class="habit-row ${done?'done':''}"><button class="check" data-toggle-habit="${h.id}">${done?'✓':''}</button><div class="task-body" data-edit-habit="${h.id}"><div class="task-title">${h.icon?`${esc(h.icon)} `:''}${esc(h.title)}</div><div class="task-meta"><span class="pill">${count}/${target} nesta semana</span><span class="pill">${habitStreak(h)} dia(s) de sequência</span>${h.time?`<span class="pill">◷ ${h.time}</span>`:''}</div><div class="rhythm-dots">${Array.from({length:target},(_,i)=>`<i class="${i<count?'on':''}"></i>`).join('')}</div></div><button class="more-btn" data-edit-habit="${h.id}">•••</button></article>`;
  }

  function planTabs(){return `<div class="segment"><button class="${planTab==='tasks'?'active':''}" data-plan-tab="tasks">Tarefas</button><button class="${planTab==='habits'?'active':''}" data-plan-tab="habits">Ritmos</button><button class="${planTab==='inbox'?'active':''}" data-plan-tab="inbox">Caixa</button></div>`}

  function weekCalendar(){
    const arr=[]; const now=new Date();
    for(let i=0;i<7;i++){
      const d=new Date(now);d.setDate(now.getDate()+i);const k=isoDate(d);
      const count=state.tasks.filter(t=>t.date===k).length,has=count>0;
      arr.push(`<div class="day ${has?'has':''} ${i===0?'today':''}" data-day-agenda="${k}" role="button" tabindex="0" aria-label="Abrir ${fmtDate(k,{weekday:'long',day:'numeric',month:'long'})}${has?` · ${count} ${count===1?'tarefa':'tarefas'}`:''}"><div><b>${d.getDate()}</b><br><span>${new Intl.DateTimeFormat('pt-BR',{weekday:'narrow'}).format(d)}</span></div>${has?'<i class="day-dot"></i>':''}</div>`);
    }
    return arr.join('');
  }

  function dayAgendaModal(date){
    const list=state.tasks.filter(t=>t.date===date).sort((a,b)=>Number(a.done)-Number(b.done)||(a.time||'99:99').localeCompare(b.time||'99:99'));

    $('[data-logout]')?.addEventListener('click',cloudSignOut);
    $('[data-login]')?.addEventListener('click',()=>patch(s=>s.loggedIn=true));
    $('[data-reset-login]')?.addEventListener('click',()=>{ if(confirm('Isso apaga os dados locais do EIXO neste aparelho. Continuar?')){localStorage.removeItem('eixo_state');localStorage.removeItem('eixo_state_v3');localStorage.removeItem('eixo_state_v4');state=structuredClone(defaults);modal={onboardStep:1};render()} });
    $('[data-install]')?.addEventListener('click',installApp);
    $$('[data-checkin]').forEach(el=>el.addEventListener('click',()=>{modal={type:'checkin',mood:'Normal'};render()}));
    $$('[data-pulse-mood]').forEach(el=>el.addEventListener('click',()=>{modal={type:'pulse',step:2,mood:el.dataset.pulseMood};render()}));
    $$('[data-pulse-action]').forEach(el=>el.addEventListener('click',()=>completeDailyPulse(el.dataset.pulseAction)));
    $('[data-pulse-reopen]')?.addEventListener('click',()=>{const p=todayPulse();modal={type:'pulse',step:1,mood:p?.mood||''};render()});
    $$('[data-mood-choice]').forEach(el=>el.onclick=()=>{modal.mood=el.dataset.moodChoice;render()});
    $('[data-notification-test]')?.addEventListener('click',testNotification);
    $('[data-capture]')?.addEventListener('click',()=>{modal={type:'capture'};render()});
    $('[data-north]')?.addEventListener('click',()=>{modal={type:'north'};render()});
    $$('[data-week-review]').forEach(el=>el.addEventListener('click',()=>{modal={type:'review'};render()}));
    $$('[data-essential-open]').forEach(el=>el.addEventListener('click',()=>{modal={type:'essential'};render()}));
    $('[data-essential-off]')?.addEventListener('click',()=>{if(state.essentialDays?.[todayISO()])state.essentialDays[todayISO()].enabled=false;save();render();toast('Modo Essencial encerrado.');});
    $$('[data-focus-open]').forEach(el=>el.onclick=()=>{modal={type:'focus',minutes:25};render()});
    $$('[data-focus-minutes]').forEach(el=>el.onclick=()=>{modal.minutes=Number(el.dataset.focusMinutes);render()});
    $('[data-start-focus]')?.addEventListener('click',startFocus);
    $('[data-finish-focus]')?.addEventListener('click',()=>completeFocus(true,true));
    $('[data-cancel-focus]')?.addEventListener('click',()=>{state.focus=structuredClone(defaults.focus);save();modal=null;render();toast('Sessão encerrada.')});
    $$('[data-toggle-habit]').forEach(el=>el.onclick=()=>toggleHabit(el.dataset.toggleHabit));
    $$('[data-edit-habit]').forEach(el=>el.onclick=()=>{modal={type:'habit',id:el.dataset.editHabit};render()});
    $$('[data-new-habit]').forEach(el=>el.onclick=()=>{modal={type:'habit'};render()});
    $$('[data-contribute]').forEach(el=>el.onclick=()=>{modal={type:'contribute',id:el.dataset.contribute};render()});
    $$('[data-inbox-task]').forEach(el=>el.onclick=()=>{const item=state.inbox.find(x=>x.id===el.dataset.inboxTask);if(item){modal={type:'task',prefill:item.text,fromInbox:item.id};render()}});
    $$('[data-delete-inbox]').forEach(el=>el.onclick=()=>{state.inbox=state.inbox.filter(x=>x.id!==el.dataset.deleteInbox);save();render()});

    $('[data-onboard-next]')?.addEventListener('click',()=>{ modal={onboardStep:(modal?.onboardStep||1)+1}; render(); });
    $('[data-onboard-back]')?.addEventListener('click',()=>{ modal={onboardStep:Math.max(1,(modal?.onboardStep||2)-1)}; render(); });
    $$('[data-purpose]').forEach(el=>el.onclick=()=>{const n=Number(el.dataset.purpose); if(state.purposes.includes(n))state.purposes=state.purposes.filter(x=>x!==n);else state.purposes.push(n);save();render()});
    $('[data-onboard-finish]')?.addEventListener('click',finishOnboarding);

    $('#task-form')?.addEventListener('submit',saveTask);
    $('#goal-form')?.addEventListener('submit',saveGoal);
    $('#habit-form')?.addEventListener('submit',saveHabit);
    $('#capture-form')?.addEventListener('submit',saveCapture);
    $('#capture-modal-form')?.addEventListener('submit',saveCapture);
    $('#contribution-form')?.addEventListener('submit',saveContribution);
    $('#north-form')?.addEventListener('submit',saveNorth);
    $('#checkin-form')?.addEventListener('submit',saveCheckin);
    $('#review-form')?.addEventListener('submit',saveWeeklyReview);
    $('#essential-form')?.addEventListener('submit',saveEssential);
    $('#profile-form')?.addEventListener('submit',saveProfile);
    $('[data-delete-task]')?.addEventListener('click',()=>deleteTask($('[data-delete-task]').dataset.deleteTask));
    $('[data-delete-goal]')?.addEventListener('click',()=>deleteGoal($('[data-delete-goal]').dataset.deleteGoal));
    $('[data-delete-habit]')?.addEventListener('click',()=>deleteHabit($('[data-delete-habit]').dataset.deleteHabit));
    $('#goal-progress')?.addEventListener('input',e=>{$('#progress-label').textContent=`${e.target.value}%`});
    $('#goal-type')?.addEventListener('change',e=>{const fin=$('#financial-goal-fields'),gen=$('#general-goal-fields');if(fin&&gen){fin.style.display=e.target.value==='financial'?'block':'none';gen.style.display=e.target.value==='general'?'block':'none'}});
    $('#avatar-input')?.addEventListener('change',handleAvatar);
  }
  function finishOnboarding(){
    const name=$('#on-name')?.value.trim(), email=$('#on-email')?.value.trim();
    if(!name){toast('Digite seu nome para continuar.');$('#on-name')?.focus();return}
    state.profile.name=name; state.profile.email=email; state.onboarded=true; state.loggedIn=true;
    if(!state.tasks.length) state.tasks=seedTasks(); if(!state.goals.length)state.goals=seedGoals();
    if(!state.habits.length)state.habits=[{id:uid(),title:'Cuidar de mim por 10 minutos',category:'Bem-estar',targetPerWeek:5,time:'',completions:[],createdAt:Date.now()}];
    modal=null; save(); render(); setTimeout(()=>toast('Seu EIXO começou.'),120);
  }
  function saveTask(e){
    e.preventDefault(); const f=new FormData(e.currentTarget); const id=e.currentTarget.dataset.id;
    const obj={title:f.get('title').trim(),notes:f.get('notes').trim(),date:f.get('date'),time:f.get('time'),priority:f.get('priority'),category:f.get('category'),repeat:f.get('repeat')||'none',reminder:f.get('reminder')==='on'};
    if(id){const t=state.tasks.find(x=>x.id===id);Object.assign(t,obj)} else state.tasks.push({id:uid(),...obj,done:false,createdAt:Date.now()});
    if(modal?.fromInbox)state.inbox=state.inbox.filter(x=>x.id!==modal.fromInbox);
    save(); modal=null; render(); toast(id?'Seu próximo passo foi atualizado ✨':'Nova direção adicionada ✨');
    if(obj.reminder) requestNotifications(false);
  }
  function toggleTask(id){
    const t=state.tasks.find(x=>x.id===id); if(!t)return;const was=t.done;t.done=!t.done;t.completedAt=t.done?Date.now():null;
    if(t.metric){t.metric.current=t.done?Number(t.metric.target):0;if(!t.done)t.metric.entries=[];}
    const reward=(t.done&&!was)?awardTraction(`task:${t.id}`,6,'Passo concluído'):{points:0};
    if(t.done&&!was&&t.repeat&&t.repeat!=='none'&&!t.generatedNext){const d=new Date(`${t.date||todayISO()}T12:00:00`);if(t.repeat==='daily')d.setDate(d.getDate()+1);if(t.repeat==='weekly')d.setDate(d.getDate()+7);if(t.repeat==='monthly')d.setMonth(d.getMonth()+1);state.tasks.push({...t,id:uid(),date:isoDate(d),done:false,completedAt:null,generatedNext:false,northDate:'',notifiedKey:null});t.generatedNext=true}
    save();render();rewardToast(reward,t.done?'Passo concluído. ✓':'Tarefa reaberta.');
  }
  function deleteTask(id){ if(!confirm('Excluir esta tarefa?'))return; state.tasks=state.tasks.filter(x=>x.id!==id);save();modal=null;render();toast('Tarefa excluída.'); }

  function saveGoal(e){
    e.preventDefault();const f=new FormData(e.currentTarget),id=e.currentTarget.dataset.id,old=id?state.goals.find(x=>x.id===id):null,type=f.get('type')||'general';
    const lines=String(f.get('steps')||'').split('\n').map(x=>x.trim()).filter(Boolean);
    const steps=lines.map(line=>{const done=line.startsWith('✓ '),text=done?line.slice(2):line,existing=old?.steps?.find(s=>s.text===text);return{id:existing?.id||uid(),text,done:existing?.done||done}});
    const obj={type,title:f.get('title').trim(),category:f.get('category'),deadline:f.get('deadline'),progress:Number(f.get('progress')||0),steps,currency:f.get('currency')||old?.currency||'BRL',targetAmount:Number(f.get('targetAmount')||0),currentAmount:Number(f.get('currentAmount')||0)};
    if(type==='financial'&&obj.targetAmount<=0){toast('Informe o valor-alvo da meta.');return}
    if(id){const hist=old.financialHistory||[];Object.assign(old,obj);old.financialHistory=hist}else state.goals.push({id:uid(),...obj,financialHistory:[],createdAt:Date.now()});
    save();modal=null;render();toast(id?'Meta atualizada ✨':'Nova meta, novo caminho ✨');
  }
  function saveContribution(e){e.preventDefault();const f=new FormData(e.currentTarget),g=state.goals.find(x=>x.id===e.currentTarget.dataset.id),amount=Number(f.get('amount')||0);if(!g||amount<=0)return;g.currentAmount=(Number(g.currentAmount)||0)+amount;g.financialHistory=g.financialHistory||[];const entry={id:uid(),amount,note:String(f.get('note')||'').trim(),at:Date.now()};g.financialHistory.push(entry);const reward=awardTraction(`contribution:${entry.id}`,8,'Avanço financeiro');save();modal=null;render();rewardToast(reward,`Avanço registrado: ${money(amount,g.currency)}`)}
  function saveHabit(e){e.preventDefault();const f=new FormData(e.currentTarget),id=e.currentTarget.dataset.id,old=state.habits.find(x=>x.id===id),obj={title:f.get('title').trim(),category:f.get('category').trim(),targetPerWeek:Number(f.get('targetPerWeek')||5),time:f.get('time')};if(old)Object.assign(old,obj);else state.habits.push({id:uid(),...obj,completions:[],createdAt:Date.now()});save();modal=null;render();toast(id?'Ritmo atualizado.':'Ritmo criado.')}
  function deleteHabit(id){if(!confirm('Excluir este ritmo?'))return;state.habits=state.habits.filter(x=>x.id!==id);save();modal=null;render();toast('Ritmo excluído.')}
  function toggleHabit(id){const h=state.habits.find(x=>x.id===id);if(!h)return;h.completions=h.completions||[];const d=todayISO(),i=h.completions.indexOf(d);let reward={points:0};if(i>=0){h.completions.splice(i,1);if(h.metricDaily&&h.progressByDate)delete h.progressByDate[d];}else{h.completions.push(d);if(h.metricDaily){h.progressByDate=h.progressByDate||{};h.progressByDate[d]={current:Number(h.metricDaily.target),entries:[]};}reward=awardTraction(`habit:${id}:${d}`,5,'Ritmo cumprido')}save();render();rewardToast(reward,i>=0?'Ritmo desmarcado.':'Mais um cuidado registrado ✨')}
  function saveCapture(e){e.preventDefault();const f=new FormData(e.currentTarget),text=String(f.get('text')||'').trim();if(!text)return;state.inbox.push({id:uid(),text,createdAt:Date.now()});save();modal=null;render();toast('Guardado na Caixa.')}
  function saveNorth(e){e.preventDefault();const ids=new FormData(e.currentTarget).getAll('north').slice(0,3);state.tasks.forEach(t=>{if(t.northDate===todayISO())t.northDate='' });ids.forEach(id=>{const t=state.tasks.find(x=>x.id===id);if(t)t.northDate=todayISO()});const reward=ids.length?awardTraction(`north:${todayISO()}`,4,'Norte do Dia'): {points:0};save();modal=null;render();rewardToast(reward,'Norte do Dia definido.')}
  function saveCheckin(e){e.preventDefault();const f=new FormData(e.currentTarget),entry={id:uid(),date:todayISO(),mood:modal?.mood||'Normal',energy:Number(f.get('energy')||3),focus:Number(f.get('focus')||3),sleep:Number(f.get('sleep')||3),win:String(f.get('win')||'').trim(),note:String(f.get('note')||'').trim(),createdAt:Date.now()};state.checkins.push(entry);const reward=awardTraction(`checkin:${todayISO()}`,6,'Check-in do dia');save();modal=null;render();rewardToast(reward,'Check-in registrado.')}
  function saveWeeklyReview(e){e.preventDefault();const f=new FormData(e.currentTarget),week=weekKey(),obj={id:uid(),week,win:String(f.get('win')||'').trim(),friction:String(f.get('friction')||'').trim(),next:String(f.get('next')||'').trim(),score:Number(f.get('score')||3),createdAt:Date.now()};state.weeklyReviews=state.weeklyReviews||[];state.weeklyReviews=state.weeklyReviews.filter(r=>r.week!==week);state.weeklyReviews.push(obj);const reward=awardTraction(`review:${week}`,18,'Revisão semanal');save();modal=null;route='evolution';render();rewardToast(reward,'Revisão semanal guardada.')}
  function saveEssential(e){e.preventDefault();const f=new FormData(e.currentTarget);state.essentialDays=state.essentialDays||{};state.essentialDays[todayISO()]={enabled:true,priorityId:String(f.get('priorityId')||''),selfCare:String(f.get('selfCare')||'').trim(),canWait:String(f.get('canWait')||'').trim(),createdAt:Date.now()};save();modal=null;route='today';render();toast('Modo Essencial ativado.')}
  function startFocus(){const mins=Number(modal?.minutes)||25,label=$('#focus-label')?.value.trim()||'';state.focus={active:true,startedAt:Date.now(),endAt:Date.now()+mins*60000,duration:mins,label,taskId:modal?.taskId||null,habitId:modal?.habitId||null};save();modal={type:'focus',minutes:mins};render();toast('Foco iniciado.')}
  function completeFocus(manual=false,notify=true){if(!state.focus?.active)return;const elapsed=Math.max(1,Math.round((Date.now()-Number(state.focus.startedAt))/60000)),duration=manual?elapsed:Number(state.focus.duration)||elapsed,entry={id:uid(),duration,label:state.focus.label||'',completedAt:Date.now()};state.focusHistory.push(entry);if(state.focus.taskId){advanceTaskMetric(state.focus.taskId,duration,{silent:true});}if(state.focus.habitId){advanceHabitMetric(state.focus.habitId,duration,{silent:true});}const reward=awardTraction(`focus:${entry.id}`,10,'Bloco de foco');state.focus=structuredClone(defaults.focus);save();if(notify){playTone(state.prefs.sound||'pulse');showSystemNotification('EIXO · Bloco concluído',`Você protegeu ${duration} minuto(s) de atenção.`)}modal=null;render();rewardToast(reward,'Bloco de foco concluído. ◉')}
  function reconcileFocus(notify=true){if(state.focus?.active&&Number(state.focus.endAt)<=Date.now())completeFocus(false,notify)}
  function startFocusTicker(){clearInterval(focusTicker);if(!state.focus?.active)return;focusTicker=setInterval(()=>{const left=focusRemaining(),a=$('#focus-time'),b=$('#focus-chip-time');if(a)a.textContent=fmtClock(left);if(b)b.textContent=fmtClock(left);if(left<=0){clearInterval(focusTicker);completeFocus(false,true)}},500)}
  async function showSystemNotification(title,body){if(!state.prefs.notifications||Notification.permission!=='granted')return;try{const reg=await Promise.race([navigator.serviceWorker?.ready,new Promise(r=>setTimeout(()=>r(null),700))]);if(reg?.showNotification)return reg.showNotification(title,{body,tag:`eixo-${Date.now()}`});new Notification(title,{body,tag:`eixo-${Date.now()}`});}catch{}}

  function deleteGoal(id){if(!confirm('Excluir esta meta?'))return;state.goals=state.goals.filter(x=>x.id!==id);save();modal=null;render();toast('Meta excluída.');}

  let pendingAvatar=null;
  function handleAvatar(e){const file=e.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{pendingAvatar=r.result;const preview=$('#profile-avatar-preview');if(preview)preview.innerHTML=`<img src="${r.result}" alt="Prévia da nova foto">`};r.readAsDataURL(file)}
  function saveProfile(e){e.preventDefault();const f=new FormData(e.currentTarget);Object.assign(state.profile,{name:f.get('name').trim(),email:f.get('email').trim(),phone:f.get('phone').trim(),birth:f.get('birth'),bio:f.get('bio').trim()});if(pendingAvatar){state.profile.avatar=pendingAvatar;pendingAvatar=null}save();modal=null;render();toast('Perfil atualizado.');}

  async function togglePref(key){
    if(key==='notifications'&&!state.prefs.notifications){const ok=await requestNotifications(true);if(!ok)return}
    patch(s=>s.prefs[key]=!s.prefs[key]);
  }
  async function requestNotifications(showFeedback=true){
    if(!('Notification'in window)){if(showFeedback)toast('Seu navegador não oferece notificações.');return false}
    if(Notification.permission==='granted')return true;
    const p=await Notification.requestPermission();if(showFeedback)toast(p==='granted'?'Notificações ativadas.':'Permissão de notificação não concedida.');return p==='granted';
  }
  async function testNotification(){
    const ok=await requestNotifications();if(!ok)return;playTone(state.prefs.sound||'pulse');
    const reg=await navigator.serviceWorker?.ready;
    if(reg)reg.showNotification('EIXO',{body:'Seu próximo passo importa. As notificações estão funcionando.',icon:'./icons/icon-192.png',badge:'./icons/icon-192.png',tag:'eixo-test',vibrate:state.prefs.vibrate?[120,70,120]:undefined});
    modal=null;render();
  }
  async function checkDueReminders(){
    if(!state.prefs.notifications||Notification.permission!=='granted')return;
    const now=new Date(),k=todayISO(),hhmm=now.toTimeString().slice(0,5),reg=await navigator.serviceWorker?.ready;
    for(const t of state.tasks){
      if(!t.reminder||t.done||t.notifiedKey===`${k}-${t.time}`||t.date!==k||!t.time||t.time>hhmm)continue;
      t.notifiedKey=`${k}-${t.time}`;save();playTone(state.prefs.sound||'pulse');reg?.showNotification('EIXO · Lembrete',{body:t.title,icon:'./icons/icon-192.png',badge:'./icons/icon-192.png',tag:`task-${t.id}`,vibrate:state.prefs.vibrate?[120,70,120]:undefined});
    }
    for(const h of state.habits){
      if(!h.time||(h.completions||[]).includes(k)||h.time>hhmm)continue;h.notified=h.notified||{};if(h.notified[k])continue;h.notified[k]=true;save();playTone(state.prefs.sound||'pulse');reg?.showNotification('EIXO · Seu ritmo pede espaço',{body:h.title,icon:'./icons/icon-192.png',badge:'./icons/icon-192.png',tag:`habit-${h.id}`,vibrate:state.prefs.vibrate?[100,60,100]:undefined});
    }
  }
  function recordMood(mood){state.checkins.push({id:uid(),date:todayISO(),mood,createdAt:Date.now()});save();modal=null;render();toast(`Check-in registrado: ${mood}.`)}
  function exportData(){
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`eixo-backup-${todayISO()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('Backup exportado.');
  }
  function importData(e){
    const file=e.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result);if(!parsed||typeof parsed!=='object'||!parsed.profile)throw new Error('invalid');localStorage.setItem('eixo_state_v4',JSON.stringify(parsed));state=load();modal=null;render();toast('Backup restaurado com sucesso.');}catch{toast('Esse arquivo não parece ser um backup válido do EIXO.');}finally{e.target.value='';}};r.readAsText(file);
  }

  async function installApp(){ if(!deferredInstallPrompt)return; deferredInstallPrompt.prompt(); await deferredInstallPrompt.userChoice; deferredInstallPrompt=null; render(); }

  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;render()});
  window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;toast('EIXO instalado.');render()});
  // Service worker gerenciado pela hospedagem nesta versão web.
  setInterval(checkDueReminders,30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){reconcileFocus(true);checkDueReminders()}});
  window.addEventListener('pageshow',()=>reconcileFocus(true));

  // URL shortcuts from manifest
  const quick=new URLSearchParams(location.search).get('quick');
  if(state.onboarded&&state.loggedIn&&quick){modal={type:quick==='goal'?'goal':'task'};history.replaceState({},'',location.pathname)}

  bootstrapTraction();
  initSupabaseAuth();
})();

</script>
