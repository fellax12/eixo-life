name: Build EIXO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar EIXO
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preparar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          command -v sdkmanager

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extrair PWA do EIXO
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname 'EIXO*v0.3*PWA*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*EIXO*.zip' | head -n 1)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: nenhum ZIP do EIXO foi encontrado."
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP_FILE"

          rm -rf extracted web

          mkdir -p extracted
          mkdir -p web

          unzip -q "$ZIP_FILE" -d extracted

          INDEX_FILE="$(find extracted -type f -name 'index.html' | head -n 1)"

          if [ -z "$INDEX_FILE" ]; then
            echo "ERRO: index.html não encontrado."
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          WEB_ROOT="$(dirname "$INDEX_FILE")"

          echo "PWA encontrada em:"
          echo "$WEB_ROOT"

          cp -a "$WEB_ROOT"/. web/

          if [ ! -f web/index.html ]; then
            echo "ERRO: index.html não foi copiado."
            exit 1
          fi

          echo "Conteúdo preparado:"
          find web -maxdepth 3 -type f | head -100

      - name: Criar projeto Android
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "eixo-life",
            "version": "0.3.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.0.0",
              "@capacitor/android": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.eixo.life",
            "appName": "EIXO",
            "webDir": "web",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npm install --no-audit --no-fund

          npx cap add android

          npx cap sync android

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd android

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            assembleDebug

      - name: Encontrar APK
        shell: bash
        run: |
          set -e

          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."

            find android -type f -name "*.apk"

            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p release

          cp "$APK" release/EIXO-v0.3.apk

          ls -lh release/EIXO-v0.3.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: EIXO-APK
          path: release/EIXO-v0.3.apk
          if-no-files-found: error
          retention-days: 30
