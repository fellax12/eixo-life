
name: Build EIXO Android v0.14

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-eixo.yml

permissions:
  contents: read

jobs:
  build:
    name: EIXO v0.14 Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      EIXO_URL: https://eixo-life.floot.app/
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -f "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          test -f "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"

      - name: Download EIXO v0.14 source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 "$EIXO_URL" -o /tmp/eixo-live.html
          test -s /tmp/eixo-live.html
          curl --fail --location --silent --show-error --retry 3 \
            'https://eixo-life.floot.app/_cdn/static/eixo-v014-working-2.txt' \
            -o /tmp/eixo-v014-source.html
          grep -qi '<!doctype html>' /tmp/eixo-v014-source.html
          grep -q 'function applyEixoReset' /tmp/eixo-v014-source.html
          grep -q 'function eixoHandleBack' /tmp/eixo-v014-source.html
          echo 'EIXO v0.14 source obtained.'

      - name: Prepare Capacitor 7 project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web
          cat > web/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EIXO</title></head>
          <body style="background:#0b0d10;color:#f5f7f9;font:16px system-ui;padding:20px">Conecte-se à internet para abrir o EIXO.</body></html>
          HTML
          cat > package.json <<'JSON'
          {
            "name": "eixo-android",
            "version": "0.14.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "7.4.3",
              "@capacitor/android": "7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.3"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.eixo.life",
            "appName": "EIXO",
            "webDir": "web",
            "android": {
              "adjustMarginsForEdgeToEdge": "auto",
              "backgroundColor": "#0b0d10"
            },
            "server": {
              "url": "https://eixo-life.floot.app/",
              "androidScheme": "https",
              "cleartext": false,
              "allowNavigation": ["eixo-life.floot.app"]
            }
          }
          JSON
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          test -f android/gradlew

      - name: Bundle and validate updated EIXO interface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('/tmp/eixo-v014-source.html').read_text(encoding='utf-8')
          # Repair literal $$ lost by string-replacement escaping in the staged UI patch.
          rule = re.compile(r'(?m)^([ \t]*)\$\(([^()\n]+)\)\.forEach')
          matches = rule.findall(source)
          if len(matches) < 6:
              raise SystemExit(f'Expected >=6 selector fixes; found {len(matches)}')
          source = rule.sub(lambda m: m.group(1) + '$$(' + m.group(2) + ').forEach', source)
          if rule.search(source):
              raise SystemExit('Unrepaired task/route selector')
          required = ['function eixoHandleBack','function applyEixoReset',
                      'data-bulk-delete','data-reset-kind','trackEixoView()',
                      'function resetModal','function bulkToolbar']
          for term in required:
              if term not in source:
                  raise SystemExit('Missing EIXO v0.14 feature: ' + term)
          dest=Path('android/app/src/main/assets/eixo-v014.html')
          dest.write_text(source,encoding='utf-8')
          print('Bundled UI, bytes:',dest.stat().st_size,'selectors repaired:',len(matches))
          PY
          node <<'JS'
          const fs = require('fs');
          const html = fs.readFileSync('android/app/src/main/assets/eixo-v014.html','utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          if (scripts.length !== 1) throw Error(`Expected 1 inline script, got ${scripts.length}`);
          new Function(scripts[0][1]);
          console.log('EIXO v0.14 native UI JavaScript syntax: PASS');
          JS

      - name: Add EIXO native integration and Android Back navigation
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$(find android/app/src/main/java -type f -name MainActivity.java | head -n 1)"
          test -n "$MAIN"
          grep -q '^package com\.eixo\.life;' "$MAIN"
          cat > "$MAIN" <<'JAVA'
          package com.eixo.life;

          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;
          import java.io.IOException;
          import java.io.InputStream;
          import java.util.Collections;

          public class MainActivity extends BridgeActivity {
              private static final String SOURCE_PATH = "/_cdn/static/3b1ec52f-a236-43a2-8bb2-150444a4f69f-eixo-v0.13-ui-polish.txt";
              private static final String BACK_SCRIPT =
                  "(function(){try{" +
                  "var f=document.querySelector('iframe[title=\"EIXO v0.4\"]');" +
                  "if(!f||!f.contentWindow)return false;" +
                  "var w=f.contentWindow;" +
                  "if(typeof w.eixoHandleBack==='function')return !!w.eixoHandleBack();" +
                  "var d=f.contentDocument;if(!d)return false;" +
                  "var modal=d.querySelector('.modal-backdrop');" +
                  "if(modal){var close=modal.querySelector('[data-close-modal]');" +
                  "if(close){close.click();return true;}return false;}" +
                  "var active=d.querySelector('.bottom-nav .nav-item.active');" +
                  "if(active&&active.getAttribute('data-route')!=='today'){" +
                  "var home=d.querySelector('.bottom-nav [data-route=\"today\"]');" +
                  "if(home){home.click();return true;}}" +
                  "return false;}catch(e){return false;}})();";

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (getBridge() != null) {
                      getBridge().setWebViewClient(new BridgeWebViewClient(getBridge()) {
                          @Override
                          public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                              if ("eixo-life.floot.app".equals(request.getUrl().getHost()) &&
                                      SOURCE_PATH.equals(request.getUrl().getPath())) {
                                  try {
                                      InputStream data = MainActivity.this.getAssets().open("eixo-v014.html");
                                      return new WebResourceResponse(
                                          "text/plain", "UTF-8", 200, "OK",
                                          Collections.singletonMap("Cache-Control", "no-store"), data
                                      );
                                  } catch (IOException ignored) {
                                      // The ordinary web resource remains available as a fallback.
                                  }
                              }
                              return super.shouldInterceptRequest(view, request);
                          }
                      });
                      WebView webView = getBridge().getWebView();
                      webView.clearCache(true);
                      webView.post(webView::reload);
                  }
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          WebView webView = getBridge() != null ? getBridge().getWebView() : null;
                          if (webView == null) {
                              exitNormally();
                              return;
                          }
                          webView.evaluateJavascript(BACK_SCRIPT, result -> {
                              if (!"true".equals(result)) exitNormally();
                          });
                      }
                      private void exitNormally() {
                          setEnabled(false);
                          getOnBackPressedDispatcher().onBackPressed();
                          setEnabled(true);
                      }
                  });
              }
          }
          JAVA
          test -s android/app/src/main/assets/eixo-v014.html
          grep -q 'BridgeWebViewClient' "$MAIN"
          grep -q 'eixoHandleBack' "$MAIN"

      - name: Compile APK
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Validate and package APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" > /tmp/eixo-badging.txt
          grep -q "package: name='com.eixo.life'" /tmp/eixo-badging.txt
          mkdir -p dist
          cp "$APK" dist/EIXO-v0.14-Android.apk
          sha256sum dist/EIXO-v0.14-Android.apk > dist/EIXO-v0.14-Android.apk.sha256
          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EIXO-v0.14-Android
          path: dist/
          if-no-files-found: error
          retention-days: 30
          
