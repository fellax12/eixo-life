name: Build EIXO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar EIXO
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verificar ambiente Android
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"

          echo "Android SDK encontrado com sucesso."

      - name: Extrair PWA do EIXO
        shell: bash
        run: |
          set -e

          echo "Arquivos no repositório:"
          find . -maxdepth 2 -type f

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname 'EIXO*v0.3*PWA*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*EIXO*.zip' | head -n 1)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: ZIP do EIXO não encontrado."
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP_FILE"

          rm -rf extracted web
          mkdir -p extracted web

          unzip -q "$ZIP_FILE" -d extracted

          echo "Conteúdo extraído:"
          find extracted -maxdepth 4 -type f

          INDEX_FILE="$(find extracted -type f -iname 'index.html' | head -n 1)"

          if [ -z "$INDEX_FILE" ]; then
            echo "ERRO: index.html não encontrado dentro do ZIP."
            exit 1
          fi

          WEB_ROOT="$(dirname "$INDEX_FILE")"

          echo "Raiz da aplicação:"
          echo "$WEB_ROOT"

          cp -a "$WEB_ROOT"/. web/

          if [ ! -f web/index.html ]; then
            echo "ERRO: index.html não foi preparado."
            exit 1
          fi

          echo "PWA preparada com sucesso."

      - name: Criar configuração do Capacitor
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "eixo-life",
            "version": "0.3.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "7.4.3",
              "@capacitor/android": "7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.3"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.eixo.life",
            "appName": "EIXO",
            "webDir": "web",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Instalar Capacitor
        shell: bash
        run: |
          npm install --no-audit --no-fund

          npx cap add android
          npx cap sync android

          echo "Projeto Android criado."

      - name: Mostrar configuração Android
        shell: bash
        run: |
          find android -maxdepth 3 -type f | head -100

          echo "Java:"
          java -version

          echo "Gradle:"
          cd android
          ./gradlew --version

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd android

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Preparar APK final
        shell: bash
        run: |
          set -e

          echo "Procurando APK..."

          find android -type f -name "*.apk"

          APK="$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERRO: compilação terminou sem APK."
            exit 1
          fi

          mkdir -p release

          cp "$APK" release/EIXO-v0.3.apk

          echo "APK FINAL:"
          ls -lh release/EIXO-v0.3.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: EIXO-APK
          path: release/EIXO-v0.3.apk
          if-no-files-found: error
          retention-days: 30
