
name: Build EIXO Android v0.13

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-eixo.yml

permissions:
  contents: read

jobs:
  build:
    name: EIXO Android Test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      EIXO_URL: https://eixo-life.floot.app/
      APP_ID: com.eixo.life
      APP_VERSION: 0.13.0
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21 required by Capacitor 7
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Android SDK from runner
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo 'ERRO: sdkmanager nao encontrado no runner.'
            exit 1
          fi

          export PATH="$(dirname "$SDKMANAGER"):$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -f "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"

          echo 'Android SDK configurado com sucesso.'

      - name: Verify published EIXO before packaging
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --silent --show-error --retry 3 \
            "$EIXO_URL" \
            -o /tmp/eixo-live.html

          test -s /tmp/eixo-live.html

          curl --fail --location --silent --show-error --retry 3 \
            'https://eixo-life.floot.app/_cdn/static/3b1ec52f-a236-43a2-8bb2-150444a4f69f-eixo-v0.13-ui-polish.txt' \
            -o /tmp/eixo-source.html

          grep -qi '<!doctype html>' /tmp/eixo-source.html
          grep -q 'initSupabaseAuth' /tmp/eixo-source.html

          echo 'EIXO published site and v0.13 source verified.'

      - name: Prepare Capacitor project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p web

          cat > web/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>EIXO</title>
          </head>
          <body style="margin:0;background:#0b0d10;color:#f5f7f9;font:16px system-ui;padding:28px">
            <h1>EIXO</h1>
            <p>Para abrir o EIXO, conecte-se à internet e reinicie o aplicativo.</p>
          </body>
          </html>
          HTML

          cat > package.json <<'JSON'
          {
            "name": "eixo-android",
            "version": "0.13.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "7.4.3",
              "@capacitor/android": "7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.3"
            }
          }
          JSON

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.eixo.life",
            "appName": "EIXO",
            "webDir": "web",
            "server": {
              "url": "https://eixo-life.floot.app/",
              "androidScheme": "https",
              "cleartext": false,
              "allowNavigation": ["eixo-life.floot.app"]
            }
          }
          JSON

      - name: Install Capacitor and generate native Android project
        shell: bash
        run: |
          set -euo pipefail

          npm install --no-audit --no-fund

          npx cap add android
          npx cap sync android

          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

          grep -q 'com.eixo.life' android/app/build.gradle

          echo 'Native Android project created.'

      - name: Compile installable APK
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          set -euo pipefail

          java -version

          chmod +x android/gradlew

          cd android

          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Validate and package APK
        shell: bash
        run: |
          set -euo pipefail

          APK='android/app/build/outputs/apk/debug/app-debug.apk'

          test -s "$APK"

          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"

          test -f "$AAPT"

          "$AAPT" dump badging "$APK" > /tmp/eixo-badging.txt

          grep -q "package: name='com.eixo.life'" /tmp/eixo-badging.txt

          mkdir -p dist

          cp "$APK" dist/EIXO-v0.13-Android-Test.apk

          sha256sum dist/EIXO-v0.13-Android-Test.apk > dist/EIXO-v0.13-Android-Test.apk.sha256

          ls -lh dist/*

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EIXO-v0.13-Android-Test
          path: dist/
          if-no-files-found: error
          retention-days: 30
          
