name: Build EIXO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar EIXO
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Localizar ZIP do EIXO
        shell: bash
        run: |
          echo "Arquivos do repositório:"
          find . -maxdepth 3 -type f

          ZIP_FILE="$(find . -type f -iname '*EIXO*Android*Source*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: ZIP do projeto EIXO não encontrado."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"

          mkdir -p /tmp/eixo
          unzip -q "$ZIP_FILE" -d /tmp/eixo

          echo "Conteúdo extraído:"
          find /tmp/eixo -maxdepth 4 -type f | head -100

          SETTINGS="$(find /tmp/eixo -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS")"

          echo "Projeto Android encontrado em:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        shell: bash
        run: |
          cd "$PROJECT_ROOT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:assembleDebug
          else
            gradle --no-daemon :app:assembleDebug
          fi

      - name: Preparar APK
        shell: bash
        run: |
          APK="$(find "$PROJECT_ROOT/app/build/outputs/apk" -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi encontrado."
            find "$PROJECT_ROOT" -type f -name "*.apk"
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p release
          cp "$APK" release/EIXO-v0.3.apk

          ls -lh release/

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: EIXO-APK
          path: release/EIXO-v0.3.apk
          if-no-files-found: error
          retention-days: 30
