name: Build EIXO Android v0.16.0 Stable Auth Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-eixo-signing-fixed.yml
      - web/index.html

permissions:
  contents: read

jobs:
  build:
    name: EIXO v0.16.0 Android - Stable Auth Sync
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      EIXO_URL: https://eixo-life.floot.app/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -f "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          test -f "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"

      - name: Load and verify permanent EIXO key
        shell: bash
        env:
          KEY_B64: ${{ secrets.EIXO_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_B64" ]; then
            echo 'ERRO: o Secret EIXO_DEBUG_KEYSTORE_BASE64 nao foi encontrado.'
            exit 1
          fi
          mkdir -p "$HOME/.android"
          chmod 700 "$HOME/.android"
          umask 077
          printf '%s' "$KEY_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          PIN='1eaf62a2d7504055022c6303dd18fbfb6458a11aae6eb544de000c65497e2926'
          KEY_SHA="$(keytool -exportcert \
            -keystore "$HOME/.android/debug.keystore" -storepass android \
            -alias androiddebugkey 2>/dev/null | sha256sum | awk '{print $1}')"
          echo "Certificate: $KEY_SHA"
          if [ "$KEY_SHA" != "$PIN" ]; then
            echo 'ERRO: certificado diferente da chave permanente EIXO.'
            exit 1
          fi
          echo "EIXO_SIGNING_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo 'Chave permanente validada.'

      - name: Validate full local EIXO v0.16 source
        shell: bash
        run: |
          set -euo pipefail
          test -s web/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/index.html')
          s=p.read_text('utf-8')
          expected=[
            'EIXO v0.16',
            'ACTIVITY_GROUPS', 'ACTIVITY_PACKS',
            'function createActivity', 'function advanceTaskMetric',
            'function advanceHabitMetric', 'function createPack',
            'function eixoHandleBack', 'function applyEixoReset',
            'function initSupabaseAuth', 'function updateRecoveredPassword',
            'function authRedirectUrl', 'function syncNow', 'function saveMetricItemEdit',
            'data-template-open', 'data-catalog-open', 'recovery-form', 'data-sync-now'
          ]
          if len(s.encode()) < 190000: raise RuntimeError('HTML aparentemente incompleto')
          for feature in expected:
            if feature not in s:raise RuntimeError('Funcao ausente: '+feature)
          print('v0.16 fonte local validada:',len(s.encode()),'bytes')
          PY
          node <<'JS'
          const fs=require('fs'),vm=require('vm');
          const h=fs.readFileSync('web/index.html','utf8');
          const scripts=[...h.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          if(scripts.length!==1)throw Error('EIXO precisa de um script principal');
          new vm.Script(scripts[0][1]);
          console.log('EIXO v0.16 JavaScript syntax: PASS');
          JS

      - name: Generate Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail
          cat > package.json <<'JSON'
          {
            "name": "eixo-android",
            "version": "0.16.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "7.4.3",
              "@capacitor/android": "7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.3"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.eixo.life",
            "appName": "EIXO",
            "webDir": "web",
            "android": {
              "adjustMarginsForEdgeToEdge": "auto",
              "backgroundColor": "#0b0d10"
            },
            "server": {
              "url": "https://eixo-life.floot.app/",
              "androidScheme": "https",
              "cleartext": false,
              "allowNavigation": ["eixo-life.floot.app"]
            }
          }
          JSON
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          test -f android/gradlew
          python3 - <<'PY'
          from pathlib import Path
          import re
          f=Path('android/app/build.gradle');s=f.read_text()
          s,a=re.subn(r'(?m)^(\s*)versionCode\s+\d+',r'\g<1>versionCode 160',s,count=1)
          s,b=re.subn(r'(?m)^(\s*)versionName\s+["\x27][^"\x27]+["\x27]',r'\g<1>versionName "0.16.0"',s,count=1)
          if a!=1 or b!=1:raise RuntimeError('versionCode/versionName nao atualizados')
          f.write_text(s)
          PY
          cat >> android/app/build.gradle <<'GRADLE'
          // EIXO: preserve the exact Android signing identity across all builds.
          android {
              signingConfigs {
                  debug {
                      def fixedKeyFile = System.getenv('EIXO_SIGNING_KEYSTORE')
                      if (!fixedKeyFile) throw new GradleException('EIXO signing key path missing')
                      storeFile file(fixedKeyFile)
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          GRADLE
          test -f "$EIXO_SIGNING_KEYSTORE"
          echo 'Gradle uses the permanent EIXO certificate.'

      - name: Bundle UI and native Android Back navigation
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$(find android/app/src/main/java -type f -name MainActivity.java | head -n 1)"
          test -n "$MAIN"
          grep -q '^package com\.eixo\.life;' "$MAIN"
          mkdir -p android/app/src/main/assets
          cp web/index.html android/app/src/main/assets/eixo-v016.html

          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='</activity>'
          if marker not in s:
              raise RuntimeError('MainActivity closing tag not found')
          deep="""
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data
                      android:scheme="com.eixo.life"
                      android:host="auth"
                      android:path="/callback" />
              </intent-filter>
          """
          s=s.replace(marker,deep+marker,1)
          p.write_text(s)
          PY
          grep -q 'android:scheme="com.eixo.life"' android/app/src/main/AndroidManifest.xml
          cat > "$MAIN" <<'JAVA'
          package com.eixo.life;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;
          import java.io.IOException;
          import java.io.InputStream;
          import java.util.Collections;

          public class MainActivity extends BridgeActivity {
              private static final String SITE_URL = "https://eixo-life.floot.app/";
              private static final String SUPABASE_HOST = "uszvprmrmoztdipgzgvh.supabase.co";
              private static final String AUTH_CALLBACK = "com.eixo.life://auth/callback";
              private static final String BACK_SCRIPT =
                  "(function(){try{" +
                  "if(typeof window.eixoHandleBack==='function')return !!window.eixoHandleBack();" +
                  "var d=document,m=d.querySelector('.modal-backdrop');" +
                  "if(m){var b=m.querySelector('[data-close-modal]');if(b){b.click();return true;}}" +
                  "var a=d.querySelector('.bottom-nav .nav-item.active');" +
                  "if(a&&a.getAttribute('data-route')!=='today'){" +
                  "var h=d.querySelector('.bottom-nav [data-route=\"today\"]');" +
                  "if(h){h.click();return true;}}" +
                  "return false;}catch(e){return false;}})();";

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  if(getBridge()!=null){
                      getBridge().setWebViewClient(new BridgeWebViewClient(getBridge()) {
                          @Override
                          public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                              Uri uri = request.getUrl();
                              if ("https".equalsIgnoreCase(uri.getScheme()) &&
                                  SUPABASE_HOST.equalsIgnoreCase(uri.getHost()) &&
                                  "/auth/v1/authorize".equals(uri.getPath()) &&
                                  "google".equals(uri.getQueryParameter("provider"))) {
                                  Uri external = Uri.parse("https://" + SUPABASE_HOST + "/auth/v1/authorize")
                                      .buildUpon()
                                      .appendQueryParameter("provider", "google")
                                      .appendQueryParameter("redirect_to", AUTH_CALLBACK)
                                      .build();
                                  try {
                                      startActivity(new Intent(Intent.ACTION_VIEW, external));
                                  } catch (Exception e) {
                                      android.util.Log.e("EIXO", "Nao foi possivel abrir o login Google", e);
                                      return false;
                                  }
                                  return true;
                              }
                              return super.shouldOverrideUrlLoading(view, request);
                          }

                          @Override
                          public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                              Uri uri=request.getUrl();
                              String path=uri.getPath();
                              if(request.isForMainFrame() &&
                                  "https".equals(uri.getScheme()) &&
                                  "eixo-life.floot.app".equalsIgnoreCase(uri.getHost()) &&
                                  (path==null||path.isEmpty()||"/".equals(path))){
                                  try{
                                      InputStream html=MainActivity.this.getAssets().open("eixo-v016.html");
                                      return new WebResourceResponse("text/html","UTF-8",200,"OK",
                                          Collections.singletonMap("Cache-Control","no-store"),html);
                                  }catch(IOException e){
                                      android.util.Log.e("EIXO","Interface empacotada indisponivel",e);
                                  }
                              }
                              return super.shouldInterceptRequest(view,request);
                          }
                      });
                      WebView webView=getBridge().getWebView();
                      webView.clearCache(true);
                      webView.post(()->{webView.stopLoading();webView.loadUrl(SITE_URL+"?eixo-native=160");});
                  }
                  getOnBackPressedDispatcher().addCallback(this,new OnBackPressedCallback(true){
                      @Override public void handleOnBackPressed(){
                          WebView w=getBridge()!=null?getBridge().getWebView():null;
                          if(w==null){exitNormally();return;}
                          w.evaluateJavascript(BACK_SCRIPT,result->{if(!"true".equals(result))exitNormally();});
                      }
                      private void exitNormally(){
                          setEnabled(false);
                          getOnBackPressedDispatcher().onBackPressed();
                          setEnabled(true);
                      }
                  });

                  handleAuthCallback(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleAuthCallback(intent);
              }

              private void handleAuthCallback(Intent intent) {
                  if(intent==null || intent.getData()==null || getBridge()==null)return;
                  Uri uri=intent.getData();
                  if(!"com.eixo.life".equalsIgnoreCase(uri.getScheme()) ||
                     !"auth".equalsIgnoreCase(uri.getHost()) ||
                     !"/callback".equals(uri.getPath()))return;

                  String fragment=uri.getEncodedFragment();
                  String query=uri.getEncodedQuery();

                  String target=SITE_URL+"?eixo-native=160";
                  if(fragment!=null && !fragment.isEmpty()){
                      target += "#" + fragment;
                  }else if(query!=null && !query.isEmpty()){
                      target += "#" + query;
                  }

                  WebView webView=getBridge().getWebView();
                  final String finalTarget=target;
                  webView.post(()->webView.loadUrl(finalTarget));
              }
          }
          JAVA
          test -s android/app/src/main/assets/eixo-v016.html
          grep -q 'text/html' "$MAIN"
          grep -q 'eixoHandleBack' "$MAIN"
          grep -q 'AUTH_CALLBACK' "$MAIN"
          grep -q 'shouldOverrideUrlLoading' "$MAIN"
          grep -q 'onNewIntent' "$MAIN"

      - name: Compile APK with permanent signature
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify package and EIXO signing identity
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$TOOLS/aapt" dump badging "$APK" > /tmp/eixo-badging.txt
          grep '^package: ' /tmp/eixo-badging.txt
          if ! grep -q "package: name='com.eixo.life' versionCode='160'" /tmp/eixo-badging.txt; then
            echo 'ERRO: packageId ou versionCode incorretos.';exit 1
          fi
          "$TOOLS/apksigner" verify --print-certs "$APK" | tee /tmp/eixo-signing.txt
          EXPECTED="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey 2>/dev/null | sha256sum | awk '{print $1}')"
          ACTUAL="$(sed -nE 's/^Signer #1 certificate SHA-256 digest: ([[:xdigit:]]+).*$/\1/p' \
            /tmp/eixo-signing.txt | head -n 1 | tr '[:upper:]' '[:lower:]')"
          echo "Expected EIXO certificate: $EXPECTED"
          echo "Actual APK certificate:   $ACTUAL"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo 'ERRO: assinatura divergente';exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/EIXO-v0.16.0.apk
          sha256sum dist/EIXO-v0.16.0.apk > dist/EIXO-v0.16.0.apk.sha256
          ls -lh dist/*

      - name: Upload installable EIXO APK
        uses: actions/upload-artifact@v4
        with:
          name: EIXO-v0.16.0-Android
          path: dist/
          if-no-files-found: error
          retention-days: 30
